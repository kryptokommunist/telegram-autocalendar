<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Telegram Events{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="/" class="logo">
                <span class="logo-icon">📅</span>
                <span class="logo-text">Telegram Events</span>
            </a>
            <nav class="nav">
                <a href="/" class="nav-link">Events</a>
                <a href="/auth" class="nav-link">Settings</a>
                <div class="sync-controls">
                    <button id="sync-btn" class="btn btn-primary" onclick="triggerSync()">
                        <span class="sync-icon">🔄</span>
                        <span class="sync-text">Sync Now</span>
                    </button>
                    <span id="sync-status" class="sync-status"></span>
                </div>
            </nav>
        </div>
    </header>

    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Telegram Auto-Calendar Bot</p>
    </footer>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
