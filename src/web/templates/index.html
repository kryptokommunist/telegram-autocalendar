{% extends "base.html" %}

{% block title %}Events - Telegram Auto-Calendar{% endblock %}

{% block content %}
<div class="events-page">
    <!-- Filters Sidebar -->
    <aside class="sidebar">
        <div class="filter-section">
            <h3>Filters</h3>

            <div class="filter-group">
                <label for="search-input">Search</label>
                <input type="text" id="search-input" class="filter-input" placeholder="Search events..." oninput="debounceSearch()">
            </div>

            <div class="filter-group">
                <label>Next 7 Days</label>
                <div class="weekday-buttons" id="weekday-buttons">
                    <!-- Populated dynamically by JS -->
                </div>
            </div>

            <div class="filter-group">
                <label for="date-from">From Date</label>
                <input type="date" id="date-from" class="filter-input" onchange="onDateFilterChange()">
            </div>

            <div class="filter-group">
                <label for="date-to">To Date</label>
                <input type="date" id="date-to" class="filter-input" onchange="onDateFilterChange()">
            </div>

            <div class="filter-group">
                <label for="price-filter">Price Type</label>
                <select id="price-filter" class="filter-input" onchange="applyFilters()">
                    <option value="">All</option>
                    <option value="free">Free</option>
                    <option value="paid">Paid</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="max-price">Max Price</label>
                <input type="number" id="max-price" class="filter-input" placeholder="e.g., 40" min="0" onchange="applyFilters()">
            </div>

            <div class="filter-group">
                <label for="event-type-filter">Event Type</label>
                <select id="event-type-filter" class="filter-input" onchange="applyFilters()">
                    <option value="">All Types</option>
                    <option value="single">One-time Event</option>
                    <option value="multiday">Multi-day (Retreat/Festival)</option>
                    <option value="recurring">Recurring (Weekly/Monthly)</option>
                    <option value="series">Course/Series</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="country-filter">Country</label>
                <select id="country-filter" class="filter-input" onchange="loadCitiesForCountry(); applyFilters()">
                    <option value="">All Countries</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="city-filter">City</label>
                <select id="city-filter" class="filter-input" onchange="applyFilters()">
                    <option value="">All Cities</option>
                </select>
            </div>

            <button class="btn btn-outline" onclick="clearFilters()">Clear Filters</button>
        </div>

        <div class="categories-section">
            <h3>Categories</h3>
            <div id="categories-list" class="categories-list">
                <!-- Populated by JS -->
            </div>
        </div>

        <div class="categories-section">
            <h3>Groups</h3>
            <input type="text" id="group-search" class="filter-input" placeholder="Search groups..." oninput="filterGroupsList()" style="margin-bottom: 0.75rem;">
            <div id="groups-list" class="categories-list">
                <!-- Populated by JS -->
            </div>
        </div>
    </aside>

    <!-- Events Grid -->
    <section class="events-section">
        <div class="events-header">
            <h1>Upcoming Events</h1>
            <div class="events-header-right">
                <span id="events-count" class="events-count"></span>
                <div class="sort-dropdown">
                    <label for="sort-select">Sort:</label>
                    <select id="sort-select" class="filter-input" onchange="applyFilters()">
                        <option value="date_asc">Date (Earliest)</option>
                        <option value="date_desc">Date (Latest)</option>
                        <option value="title_asc">Title (A-Z)</option>
                        <option value="title_desc">Title (Z-A)</option>
                        <option value="price_asc">Price (Low-High)</option>
                        <option value="price_desc">Price (High-Low)</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="events-grid" class="events-grid">
            <!-- Populated by JS -->
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Loading events...</p>
        </div>

        <div id="no-events" class="no-events" style="display: none;">
            <p>No events found. Try adjusting your filters or sync new messages.</p>
        </div>
    </section>
</div>

<!-- Event Modal -->
<div id="event-modal" class="modal" style="display: none;">
    <div class="modal-overlay" onclick="closeModal()"></div>
    <div class="modal-content">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div id="modal-body">
            <!-- Populated by JS -->
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Initialize page
    document.addEventListener('DOMContentLoaded', function() {
        initWeekdayButtons();
        loadCategories();
        loadGroups();
        loadLocations();
        loadEvents();
        updateSyncStatus();

        // Poll sync status every 5 seconds
        setInterval(updateSyncStatus, 5000);
    });
</script>
{% endblock %}
